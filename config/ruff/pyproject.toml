# Пользовательский конфиг ruff.
#
# Когда применяется: ТОЛЬКО если рядом с проверяемым файлом нет проектного
# конфига (pyproject.toml с секцией [tool.ruff], ruff.toml, .ruff.toml).
# Ruff ищет ближайший конфиг вверх по дереву; если не нашёл — берёт этот файл
# вместо встроенных дефолтов. Проекты этим файлом НЕ затрагиваются.
#
# Путь зафиксирован самим ruff: ${config_dir}/ruff/pyproject.toml,
# на Linux это ~/.config/ruff/pyproject.toml (в имени обязательно pyproject.toml).
#
# Зачем: чтобы одиночные скрипты вне проекта проверялись и форматировались
# по тем же правилам, что и код в проектах, а не по дефолтам ruff
# (по умолчанию: line-length = 88, target-version = py310).

[tool.ruff]
# Целевая версия Python. Влияет на набор доступных правил и на подсказки.
# Дефолт ruff — py310; здесь py312, как в рабочих проектах.
target-version = "py312"

# Максимальная длина строки (общая для линтера и форматтера ruff).
# Дефолт ruff — 88 (стиль Black); здесь 100.
line-length = 100

# Исключение Markdown: ruff >= 0.16 умеет форматировать Python-блоки внутри .md.
# Если хочешь, чтобы глобально .md не трогались, раскомментируй строку:
# extend-exclude = ["*.md"]

# Набор правил НЕ задаём: работает дефолтный набор ruff, а он широкий
# (pyflakes, pycodestyle, isort, pyupgrade, flake8-bugbear, подмножество pylint,
# ruff-specific и др.). Полный список: https://docs.astral.sh/ruff/default-rules/
# Важно: `select` ЗАМЕНЯЕТ дефолтный набор целиком, `extend-select` — добавляет.
# Если захочешь усилить проверки, используй extend-select:
# [tool.ruff.lint]
# extend-select = ["B", "SIM", "RUF"]
