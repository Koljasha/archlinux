# Конфигурация Gitleaks для репозитория NafmanOs.
#
# Gitleaks ищет секреты (токены, ключи, пароли) в файлах и в истории git.
# Примеры запуска:
#     gitleaks detect --source . --config .gitleaks.toml   # история коммитов
#     gitleaks dir . --config .gitleaks.toml               # рабочее дерево
#
# Проверено: секретов ни в дереве, ни в истории нет, поэтому исключений не
# требуется. Ранее здесь был глобальный allowlist по шаблону XF86[A-Za-z]+:
# он не нужен, а из-за широты мог бы скрыть настоящую находку на строке, где
# встречается XF86. Если понадобится точечное исключение — добавьте секцию
# [[allowlists]] с конкретным путём или regex (пустые списки gitleaks
# не принимает).

